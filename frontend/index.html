<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07080c" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>CraftLanee</title>
    <script>
      // Apply the saved theme before first paint (no flash).
      try { var t = localStorage.getItem("cl.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Shown instantly while the app's JavaScript loads; React replaces it. Same markup as src/components/Splash.tsx. -->
      <div class="cl-splash" role="status" aria-label="CraftLanee — Loading your workspace">
        <div class="cl-stage" aria-hidden="true">
          <div class="cl-orbit"></div>
          <div class="cl-track"></div>
          <div class="cl-arc"></div>
          <div class="cl-head"></div>
          <div class="cl-plate"><img src="/brand/craftlanee-mark.png" alt="" /></div>
        </div>
        <div class="cl-caption"><strong>CraftLanee</strong><span>Loading your workspace</span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
